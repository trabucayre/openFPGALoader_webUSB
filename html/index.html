		async function ofl_exec(args, div_id, fileIn={}, verbose=true) {
			let lines = [];
			let lines_err = [];

			const div_log = document.getElementById(div_id);

			const device = await navigator.usb.requestDevice({ filters: [] });
			div_log.innerHTML = "";

			try {
				const response = await runOpenFPGALoader(args,
					fileIn,
					{
						stdout:lineBuffered((line) => lines.push(line)),
						stderr:lineBuffered((line) => lines_err.push(line)),
						decodeASCII: true
					}
				);
				lines.map((line, i) => {
					if (verbose) {
						console.log(line);
					}
					div_log.innerHTML += line + "</br>\n";
				});
			} catch(error) {
				//div_log.textContent = `Status: Error programming - ${error.message}`;
                console.error(error);
				console.log(error);
			}
			console.log(lines);
			console.log(lines_err);
			return lines;
		}

		async function fill_cables() {
			const select_cable = document.getElementById('cable_select');
			let lines = [];
			const response = await runOpenFPGALoader(["--list-cables"],
				{},
				{
					stdout:lineBuffered((line) => lines.push(line)),
					stderr:console.log, decodeASCII: true
				}
			);
			//console.log(response);
			lines = lines.slice(2);
			lines.map( (line, i) => {
			    let opt = document.createElement("option");
				const cable = line.split(' ')[0];
			    opt.value = i + 1; // the index
			    opt.innerHTML = cable;
			    select_cable.append(opt);
			});
		}
		async function fill_boards() {
			const select_board = document.getElementById('board_select');
			let lines = [];
			const response = await runOpenFPGALoader(["--list-boards"],
				{},
				{
					stdout:lineBuffered((line) => lines.push(line)),
					stderr:console.log, decodeASCII: true
				}
			);
			lines = lines.slice(2);
			lines.map( (line, i) => {
			    let opt = document.createElement("option");
				const cable = line.split(' ')[0];
			    opt.value = i + 1; // the index
			    opt.innerHTML = cable;
			    select_board.append(opt);
			});
		}

		document.getElementById('fileInput').addEventListener('change', async function () {
			let file = event.target.files[0];
			const filename = file.name;
			var fileContent;

			let reader = new FileReader();
			reader.onload = function (event) {
				const binaryData = new Uint8Array(event.target.result);
				fileContent = binaryData;
				const ofl_cmd = document.getElementById("ofl_cmd")
				var cmd = ["-c", "digilent", "--quiet"];//ofl_cmd.value.split(' ');
				cmd.push(filename);
				var fileData = {[filename]: fileContent};
				ofl_exec(cmd, "demo", fileData, true);
			};

			reader.readAsArrayBuffer(file);
		});

				lines = lines.slice(2);
				lines.map((line, i) => {
					console.log(line);
					demo.innerHTML += line + "</br>\n";

				//console.log(typeof lines);

				//});
				//demo.innerHTML = cables_name.join("<br>\n");
				//lines.map( (line, i) => {
				//    let opt = document.createElement("option");
				//	const cable = line.split(' ')[0];
				//    opt.value = i + 1; // the index

				//});
				//const response = await runOpenFPGALoader(["--help"], {}, {stdout:my_load, stderr:console.log, decodeASCII: true});
                //await openFPGALoader({
				//	scanUSB: true
                //});

                //status.textContent = 'Status: FPGA programmed successfully!';

            } catch (error) {
                status.textContent = `Status: Error programming - ${error.message}`;
                //console.error(error);
            }
        });

        // Handle connect button click
        connectButton.addEventListener('click', async () => {
            try {
                // Request a USB device with filters (adjust VID/PID as needed)
                device = await navigator.usb.requestDevice({ filters: [] });
                await device.open();
                await device.selectConfiguration(1);
                await device.claimInterface(0);
                status.textContent = `Status: Connected to ${device.productName}`;
                programButton.disabled = false;
                connectButton.disabled = true;
            } catch (error) {
                status.textContent = `Status: Error connecting - ${error.message}`;
                console.error(error);
            }
        });

        // Handle program button click
        programButton.addEventListener('click', async () => {
            try {
                status.textContent = 'Status: Loading bitstream...';
                
                // Example: Fetch a bitstream file (replace with your bitstream URL)
                const response = await fetch('path/to/arty_bitstream.bit');
                const bitstream = await response.arrayBuffer();

                // Convert ArrayBuffer to Uint8Array for WebUSB
                const bitstreamData = new Uint8Array(bitstream);

                // Use openFPGALoader to program the FPGA
                await openFPGALoader({
                    device: device,
                    bitstream: bitstreamData,
                    board: 'arty', // Specify your FPGA board (e.g., 'arty')
                    writeSram: true // Program to SRAM (use writeFlash: true for flash)
                });

                status.textContent = 'Status: FPGA programmed successfully!';
            } catch (error) {
                status.textContent = `Status: Error programming - ${error.message}`;
                console.error(error);
            }
        });

        // Handle device disconnection
        navigator.usb.addEventListener('disconnect', (event) => {
            if (event.device === device) {
                status.textContent = 'Status: Device disconnected';
                programButton.disabled = true;
                connectButton.disabled = false;
                device = null;
            }
        });
