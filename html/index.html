<!DOCTYPE html>
<script type="module" src="main.js"></script>
<!--<script type="text/javascript">
</script>-->
<html lang="en">
<head>
<!-- Cross-Origin-Opener-Policy: same-origin
Cross-Origin-Embedder-Policy: require-corp
These are new security requirements for using SharedArrayBuffer.

You can check in code if cross origin isolation is enabled:

if (crossOriginIsolated) {
	// SharedArrayBuffer is available
} -->
	<meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
	<meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WebUSB openFPGALoader Example</title>
</head>
<body>
	<h1>Program FPGA with WebUSB</h1>

	<div>
		<h2>Note: for Linux users, ftdi_sio driver must be unloaded with sudo modprobe -r ftdi_sio</h2>
	</div>
	</br>
	<table border="1" style=" border-collapse: collapse;  border: 1px solid black;">
		<thead>
			<tr><th colspan="2">OpenFPGALoader manual operations</th></tr>
		</thead>
		<tr>
			<td><label for="ofl_cmd_lbl">Options / command line:</label></td>
			<td><input type="text" id="ofl_cmd" style="width:100%; box-sizing:border-box;" /></td>
		</tr>
		<tr>
			<td><label for="ofl_cmd_lbl">Bitstream:</label></td>
			<td>
				<input type="file" id="fileInput">
				<div id="fileContents"></div>
			</td>
		</tr>
		<tr>
			<td colspan=2><button id="programButtonManual">Program FPGA</button></td>
		</tr>
	</table>
	</br>
	<!--<button id="detectButton">Detect Cables</button>
	<button id="connectButton">Connect to FPGA</button>-->

	<div>
	<fieldset style="width:0px">
  		<legend>OpenFPGALoader automatic operations:</legend>
		<!--<table border="0" style=" border-collapse: collapse;  border: 1px solid black;">-->
		<table style="border-collapse: collapse;">
			<tr><td>
			<table border="1" style=" border-collapse: collapse;  border: 1px solid black;">
				<tr>
					<td>
						<label for="cable_select">Choose a cable:</label></br>
						<select name="cable" id="cable_select">
							<option value=0>Default</option>
						</select>
					</td>
					<td>
						<label for="board_select">Choose a board:</label></br>
						<select name="board" id="board_select">
							<option value=0>None</option>
						</select>
					</td>
				</tr>
			</table>
			</td></tr>
			<tr><td>
				Target:
				<div>
					<input type="radio" id="ofl_sram" name="ofl_mode" value="sram" checked />
					<label for="sram">SRAM</label>
				</div>
				<div>
					<input type="radio" id="ofl_flash" name="ofl_mode" value="flash" />
					<label for="flash">Flash</label>
				</div>
			</td></tr>
			<tr><td>
				<label for="verify">Verify</label>
				<input type="checkbox" id="ofl_verify" name="ofl_verify" />
			</td></tr>
			<tr><td>
				<label for="ofl_cmd_lbl">Bitstream:</label>
				<input type="file" id="fileAutoInput">
			</td></tr>
			<tr><td>
				<button id="programButton">Program FPGA</button>
			</td></tr>
		</table>
	</fieldset>

	</div>
	</br>

	<div id="oflCmdManual"></div>
	<div id="USBStatus">Status: Not connected</div>
	<div id="OFLStatus">Program status: NA</div>
	<div id="demo">Status: Not connected</div>
</body>
</html>
